# Streamlit Clean Modern Theme configuration
# CleanTech / Solar ROI Theme with Inter, Plus Jakarta Sans, and JetBrains Mono

[theme]
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "'Inter':https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Plus Jakarta Sans':https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.875rem"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 500, 500]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false
paddingTop = "1rem"
paddingBottom = "2.5rem"

[theme.light]
primaryColor = "#0284C7"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#0284C7"
borderColor = "#E2E8F0"
codeTextColor = "#334155"
greenColor = "#10B981"
redColor = "#EF4444"
yellowColor = "#F59E0B"
orangeColor = "#EA580C"
blueColor = "#0284C7"
violetColor = "#8B5CF6"
grayColor = "#64748B"
chartCategoricalColors = [
    "#0284C7",
    "#10B981",
    "#F59E0B",
    "#8B5CF6",
    "#EF4444",
    "#06B6D4",
